<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grand Piano - KL35Ronaldo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Mobile Landscape Prompt -->
    <div id="orientation-warning">
        <h2>Rotate Your Device</h2>
        <p>Please rotate your phone to <b>Landscape Mode</b> for the best piano experience.</p>
    </div>

    <div class="container">
        <header>
            <h1>CONCERT GRAND</h1>
            <p>Powered by KL35Ronaldo &bull; Play via Mouse, Touch, or Keyboard</p>
        </header>

        <div class="piano-case">
            <div class="brand-logo">Maestro &bull; Acoustic Grand</div>
            <div class="keyboard" id="keyboard">
                <!-- Keys are dynamically injected via script.js -->
            </div>
        </div>

        <footer>
            <span>More features coming soon (Harmonium, Violin, Classical Raga Notations, Metronome, Recording)!</span>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
